[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pynivo"
version = "0.1.0"
description = "A beginner-focused, offline-first Python desktop IDE."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.20,<7",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[project.gui-scripts]
pynivo = "pynivo.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pynivo"]

[tool.hatch.build.targets.wheel.force-include]
"src/pynivo/learning/data" = "pynivo/learning/data"

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
