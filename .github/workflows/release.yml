name: Signed Windows prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Require signing credentials
        shell: pwsh
        run: |
          if (-not $env:SIGNING_CERTIFICATE -or -not $env:SIGNING_PASSWORD) {
            throw "Windows signing secrets are not configured. See CODE_SIGNING.md."
          }
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run release checks
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m pytest
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build verified installer
        run: python packaging/windows/build_installer.py
      - name: Sign and verify installer
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "pynivo-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:SIGNING_CERTIFICATE)
          )
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "Windows SignTool was not found." }
          $installer = Get-Item dist/installer/*.exe
          & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f $certificate /p $env:SIGNING_PASSWORD $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Signing failed." }
          & $signTool.FullName verify /pa /v $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed." }
      - name: Create checksum
        shell: pwsh
        run: |
          $file = Get-Item dist/installer/*.exe
          (Get-FileHash $file.FullName -Algorithm SHA256).Hash + "  " + $file.Name |
            Set-Content -Encoding ascii dist/installer/SHA256SUMS.txt
      - name: Create draft prerelease
        shell: pwsh
        run: |
          $assets = (Get-ChildItem dist/installer/*).FullName
          gh release create "${{ inputs.tag }}" $assets `
            --draft --prerelease --generate-notes `
            --title "PyNivo ${{ inputs.tag }} Preview"
      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "pynivo-signing.pfx") -Force -ErrorAction SilentlyContinue
